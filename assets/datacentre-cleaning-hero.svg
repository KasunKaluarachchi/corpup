<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animated illustration of specialist data centre cleaning</title>
<desc>A technician in ESD-safe gear cleans beneath a raised floor tile among rows of illuminated server racks, with dust particles drifting upward and rack LEDs blinking.</desc>

<rect x="0" y="0" width="680" height="420" fill="#0e1526"/>

<!-- raised floor grid -->
<g stroke="#26314a" stroke-width="1">
<line x1="0" y1="330" x2="680" y2="330"/>
<line x1="0" y1="360" x2="680" y2="360"/>
<line x1="0" y1="390" x2="680" y2="390"/>
<line x1="60" y1="330" x2="20" y2="420"/>
<line x1="170" y1="330" x2="140" y2="420"/>
<line x1="280" y1="330" x2="260" y2="420"/>
<line x1="390" y1="330" x2="380" y2="420"/>
<line x1="500" y1="330" x2="500" y2="420"/>
<line x1="610" y1="330" x2="620" y2="420"/>
</g>

<!-- lifted floor tile -->
<rect x="230" y="325" width="120" height="10" fill="#3a4a68" stroke="#54688c" stroke-width="1" transform="rotate(-6 290 330)"/>

<!-- server rack row background -->
<g>
<rect x="30" y="90" width="90" height="240" rx="4" fill="#182136" stroke="#2c3a58" stroke-width="1"/>
<rect x="140" y="70" width="90" height="260" rx="4" fill="#182136" stroke="#2c3a58" stroke-width="1"/>
<rect x="440" y="70" width="90" height="260" rx="4" fill="#182136" stroke="#2c3a58" stroke-width="1"/>
<rect x="550" y="90" width="90" height="240" rx="4" fill="#182136" stroke="#2c3a58" stroke-width="1"/>
</g>

<!-- rack unit lines and blinking LEDs -->
<g>
<g id="rackA">
<line x1="40" y1="110" x2="110" y2="110" stroke="#26314a" stroke-width="1"/>
<line x1="40" y1="140" x2="110" y2="140" stroke="#26314a" stroke-width="1"/>
<line x1="40" y1="170" x2="110" y2="170" stroke="#26314a" stroke-width="1"/>
<line x1="40" y1="200" x2="110" y2="200" stroke="#26314a" stroke-width="1"/>
<line x1="40" y1="230" x2="110" y2="230" stroke="#26314a" stroke-width="1"/>
<line x1="40" y1="260" x2="110" y2="260" stroke="#26314a" stroke-width="1"/>
<line x1="40" y1="290" x2="110" y2="290" stroke="#26314a" stroke-width="1"/>
<circle cx="102" cy="120" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
<circle cx="102" cy="150" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
<circle cx="102" cy="180" r="2" fill="#e8a33d"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></circle>
<circle cx="102" cy="210" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="102" cy="240" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
<circle cx="102" cy="270" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<g id="rackB">
<line x1="150" y1="90" x2="220" y2="90" stroke="#26314a" stroke-width="1"/>
<line x1="150" y1="120" x2="220" y2="120" stroke="#26314a" stroke-width="1"/>
<line x1="150" y1="150" x2="220" y2="150" stroke="#26314a" stroke-width="1"/>
<line x1="150" y1="180" x2="220" y2="180" stroke="#26314a" stroke-width="1"/>
<line x1="150" y1="210" x2="220" y2="210" stroke="#26314a" stroke-width="1"/>
<line x1="150" y1="240" x2="220" y2="240" stroke="#26314a" stroke-width="1"/>
<line x1="150" y1="270" x2="220" y2="270" stroke="#26314a" stroke-width="1"/>
<line x1="150" y1="300" x2="220" y2="300" stroke="#26314a" stroke-width="1"/>
<circle cx="212" cy="100" r="2" fill="#3a8ee8"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="130" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="160" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="190" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="220" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="250" r="2" fill="#e8a33d"><animate attributeName="opacity" values="1;0.2;1" dur="1.0s" repeatCount="indefinite"/></circle>
<circle cx="212" cy="280" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
</g>
<g id="rackC">
<line x1="450" y1="90" x2="520" y2="90" stroke="#26314a" stroke-width="1"/>
<line x1="450" y1="120" x2="520" y2="120" stroke="#26314a" stroke-width="1"/>
<line x1="450" y1="150" x2="520" y2="150" stroke="#26314a" stroke-width="1"/>
<line x1="450" y1="180" x2="520" y2="180" stroke="#26314a" stroke-width="1"/>
<line x1="450" y1="210" x2="520" y2="210" stroke="#26314a" stroke-width="1"/>
<line x1="450" y1="240" x2="520" y2="240" stroke="#26314a" stroke-width="1"/>
<line x1="450" y1="270" x2="520" y2="270" stroke="#26314a" stroke-width="1"/>
<line x1="450" y1="300" x2="520" y2="300" stroke="#26314a" stroke-width="1"/>
<circle cx="512" cy="100" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
<circle cx="512" cy="130" r="2" fill="#3a8ee8"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="512" cy="160" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
<circle cx="512" cy="190" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="512" cy="220" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/></circle>
<circle cx="512" cy="250" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="512" cy="280" r="2" fill="#e8a33d"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
</g>
<g id="rackD">
<line x1="560" y1="110" x2="630" y2="110" stroke="#26314a" stroke-width="1"/>
<line x1="560" y1="140" x2="630" y2="140" stroke="#26314a" stroke-width="1"/>
<line x1="560" y1="170" x2="630" y2="170" stroke="#26314a" stroke-width="1"/>
<line x1="560" y1="200" x2="630" y2="200" stroke="#26314a" stroke-width="1"/>
<line x1="560" y1="230" x2="630" y2="230" stroke="#26314a" stroke-width="1"/>
<line x1="560" y1="260" x2="630" y2="260" stroke="#26314a" stroke-width="1"/>
<line x1="560" y1="290" x2="630" y2="290" stroke="#26314a" stroke-width="1"/>
<circle cx="622" cy="120" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
<circle cx="622" cy="150" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="622" cy="180" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
<circle cx="622" cy="210" r="2" fill="#3a8ee8"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
<circle cx="622" cy="240" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
<circle cx="622" cy="270" r="2" fill="#4fd1a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
</g>

<!-- floor reflection glow, gentle pulse -->
<ellipse cx="340" cy="335" rx="150" ry="14" fill="#1c2740">
<animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
</ellipse>

<!-- technician silhouette, cleaning between racks -->
<g>
<path d="M320 250 Q315 220 335 210 Q355 205 365 225 Q368 245 355 260 L355 300 Q345 310 330 305 L320 260 Z" fill="#3a4a68"/>
<circle cx="345" cy="200" r="14" fill="#4a5c82"/>
<path d="M300 275 Q290 270 292 260 Q294 250 302 253" fill="none" stroke="#4fd1a5" stroke-width="2" stroke-linecap="round"/>

<!-- arm and wand, gently sweeping -->
<g>
<animateTransform attributeName="transform" type="rotate" values="0 330 250; -6 330 250; 0 330 250; 5 330 250; 0 330 250" dur="4s" repeatCount="indefinite"/>
<path d="M330 250 Q300 265 280 278" fill="none" stroke="#3a4a68" stroke-width="10" stroke-linecap="round"/>
<line x1="280" y1="278" x2="245" y2="300" stroke="#8a97b0" stroke-width="4" stroke-linecap="round"/>
<circle cx="240" cy="303" r="6" fill="#4fd1a5">
<animate attributeName="r" values="6;7.5;6" dur="1.2s" repeatCount="indefinite"/>
</circle>
</g>

<path d="M330 300 Q325 320 300 328 L295 340 L310 340 L335 322 Z" fill="#2c3a58"/>
<path d="M355 300 Q365 320 385 325 L390 338 L375 340 L350 320 Z" fill="#2c3a58"/>
</g>

<!-- dust particles drifting upward and fading -->
<g fill="#8a97b0">
<circle cx="225" r="2"><animate attributeName="cy" values="300;220" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="212" r="1.6"><animate attributeName="cy" values="290;200" dur="3.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></circle>
<circle cx="198" r="1.4"><animate attributeName="cy" values="280;190" dur="4.2s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="4.2s" begin="0.9s" repeatCount="indefinite"/></circle>
<circle cx="234" r="1.8"><animate attributeName="cy" values="295;210" dur="3.3s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0" dur="3.3s" begin="1.3s" repeatCount="indefinite"/></circle>
<circle cx="218" r="1.2"><animate attributeName="cy" values="285;180" dur="4.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="4.6s" begin="1.8s" repeatCount="indefinite"/></circle>
<circle cx="206" r="1.5"><animate attributeName="cy" values="298;225" dur="2.8s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;0" dur="2.8s" begin="2.2s" repeatCount="indefinite"/></circle>
</g>

<!-- overhead light beams, soft flicker -->
<g fill="#243354">
<polygon points="75,0 55,90 95,90"><animate attributeName="opacity" values="0.5;0.6;0.5" dur="5s" repeatCount="indefinite"/></polygon>
<polygon points="185,0 160,70 210,70"><animate attributeName="opacity" values="0.5;0.35;0.5" dur="6s" repeatCount="indefinite"/></polygon>
<polygon points="485,0 460,70 510,70"><animate attributeName="opacity" values="0.5;0.6;0.5" dur="4.5s" repeatCount="indefinite"/></polygon>
<polygon points="595,0 575,90 615,90"><animate attributeName="opacity" values="0.5;0.4;0.5" dur="5.5s" repeatCount="indefinite"/></polygon>
</g>
</svg>
